name: affine-source

services:
  proxy:
    build:
      context: ../..
      dockerfile: .docker/source-build/nginx.Dockerfile
    ports:
      - '${PUBLIC_PORT:-8080}:80'
    depends_on:
      affine:
        condition: service_started
      worker:
        condition: service_started
    restart: unless-stopped

  affine:
    build:
      context: ../..
      dockerfile: .docker/source-build/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - affine_source_storage:/root/.affine/storage
      - affine_source_config:/root/.affine/config
    env_file:
      - .env
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      AFFINE_INDEXER_ENABLED: 'false'
      DEPLOYMENT_TYPE: selfhosted
    expose:
      - '3010'
    restart: unless-stopped

  affine_migration:
    build:
      context: ../..
      dockerfile: .docker/source-build/Dockerfile
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    volumes:
      - affine_source_storage:/root/.affine/storage
      - affine_source_config:/root/.affine/config
    env_file:
      - .env
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      AFFINE_INDEXER_ENABLED: 'false'
      DEPLOYMENT_TYPE: selfhosted
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../../affine-workers
    env_file:
      - .env
    environment:
      PORT: '3000'
    expose:
      - '3000'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - affine_source_postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE:-affine}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  affine_source_postgres:
  affine_source_storage:
  affine_source_config:
