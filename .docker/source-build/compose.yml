name: affine-source

services:
  affine:
    build:
      context: ../..
      dockerfile: .docker/source-build/Dockerfile
    ports:
      - '${PUBLIC_PORT:-8080}:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - ${UPLOAD_LOCATION:-./data/storage}:/root/.affine/storage
      - ${CONFIG_LOCATION:-./data/config}:/root/.affine/config
    env_file:
      - .env
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      AFFINE_INDEXER_ENABLED: 'false'
      DEPLOYMENT_TYPE: selfhosted
    restart: unless-stopped

  affine_migration:
    build:
      context: ../..
      dockerfile: .docker/source-build/Dockerfile
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    volumes:
      - ${UPLOAD_LOCATION:-./data/storage}:/root/.affine/storage
      - ${CONFIG_LOCATION:-./data/config}:/root/.affine/config
    env_file:
      - .env
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      AFFINE_INDEXER_ENABLED: 'false'
      DEPLOYMENT_TYPE: selfhosted
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../../affine-workers
    env_file:
      - .env
    environment:
      PORT: '3000'
    expose:
      - '3000'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - ${DB_DATA_LOCATION:-./data/postgres/pgdata}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE:-affine}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
